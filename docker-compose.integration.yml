services:
  localstack:
    container_name: "loafer-awsx-integration-localstack"
    # Pin to the 3.x community line. The unpinned `latest` tag now resolves to a
    # build that refuses to start without a LocalStack license token (exit 55).
    image: localstack/localstack:3
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - SERVICES=sqs,sns
      - DEBUG=0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(running\\|available\\)\"' && curl -sf http://localhost:4566/_localstack/health | grep -q '\"sns\": \"\\(running\\|available\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
